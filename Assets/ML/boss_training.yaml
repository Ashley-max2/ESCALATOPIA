behaviors:
  BossAgent:
    # ─────────────────────────────────────────────────────────────────
    # Algoritmo: PPO (Proximal Policy Optimization)
    # Bueno para acciones mixtas discretas/continuas y entornos complejos.
    # ─────────────────────────────────────────────────────────────────
    trainer_type: ppo

    hyperparameters:
      # Tamaño del mini-batch (cuántos pasos se usan por actualización)
      # Más grande = más estable pero más lento
      batch_size: 1024

      # Pasos recogidos antes de actualizar la política
      buffer_size: 10240

      # Tasa de aprendizaje inicial (se decae automáticamente)
      learning_rate: 3.0e-4

      # Función de decaimiento de la tasa de aprendizaje
      learning_rate_schedule: linear

      # Coeficiente de entropía (fuerza exploración aleatoria)
      # Alto al inicio → más exploración → descubre todas las mecánicas
      beta: 5.0e-3

      # Clipping de PPO (no cambiar demasiado la política de golpe)
      epsilon: 0.2

      # Coeficiente para la pérdida del value function
      lambd: 0.95

      # Épocas de optimización por buffer recogido
      num_epoch: 3

      # Shared critic para normalización de ventajas
      shared_critic: false

    network_settings:
      # Normalizar observaciones automáticamente (muy útil con valores muy distintos)
      normalize: true

      # Número de capas ocultas
      num_layers: 3

      # Neuronas por capa (más neuronas = más capacidad, más lento)
      hidden_units: 256

      # Arquitectura de la red
      vis_encode_type: simple

      # LSTM para memoria temporal (el boss recuerda lo que pasó antes del episodio)
      # Muy útil para navegar por el mapa sin perderse
      memory:
        memory_size: 256
        sequence_length: 64

    reward_signals:
      # ── Recompensa extrínseca (la que definimos en BossAgent.cs) ──
      extrinsic:
        gamma: 0.995         # Descuento (0.99-0.999 para tareas largas)
        strength: 1.0

      # ── Recompensa de curiosidad (fuerza exploración automática) ──
      # El boss recibe bonus por visitar estados nuevos que no ha visto antes.
      # Esto le hace probar TODAS las mecánicas (saltar, escalar, gancho)
      # sin necesidad de programarlo explícitamente.
      curiosity:
        gamma: 0.99
        strength: 0.04       # Escala la curiosidad vs recompensa real
        encoding_size: 256
        learning_rate: 3.0e-4

    # ─────────────────────────────────────────────────────────────────
    # Pasos máximos totales de entrenamiento
    # 10M = buen punto para comportamientos complejos de navegación
    # Aumentar a 20-50M si las metas avanzadas no se consiguen
    # ─────────────────────────────────────────────────────────────────
    max_steps: 10000000

    # Cada cuántos pasos guardar checkpoint
    checkpoint_interval: 250000

    # Cada cuántos pasos loggear estadísticas
    summary_freq: 10000

    # ─────────────────────────────────────────────────────────────────
    # Curriculum Learning
    # El entrenamiento empieza "fácil" y aumenta la dificultad gradualmente.
    # Aquí controlamos el tiempo máximo del episodio según el progreso.
    # ─────────────────────────────────────────────────────────────────
    # (Activar curriculum en Unity con EnvironmentParameters si se desea)

    # ─────────────────────────────────────────────────────────────────
    # Configuración del entorno
    # ─────────────────────────────────────────────────────────────────
    keep_checkpoints: 10      # Guarda los últimos 10 checkpoints
    even_checkpoints: false   # Los checkpoints más recientes tienen más valor

# ─────────────────────────────────────────────────────────────────────
# Cómo entrenar (ejecutar en terminal desde la raíz del proyecto):
#
#   mlagents-learn Assets/ML/boss_training.yaml --run-id=boss_v1
#
# Para reanudar un entrenamiento:
#   mlagents-learn Assets/ML/boss_training.yaml --run-id=boss_v1 --resume
#
# Para ver las estadísticas en TensorBoard:
#   tensorboard --logdir results
#   → Abre http://localhost:6006 en el navegador
#
# Versión recomendada de ML-Agents: 0.30+ (Release 20+)
# Instalar: pip install mlagents
# ─────────────────────────────────────────────────────────────────────
